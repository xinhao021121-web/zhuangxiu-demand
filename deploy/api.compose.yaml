# API 服务的最小编排：一条命令起服务。
#
#   docker compose -f deploy/api.compose.yaml up -d
#
# 密钥只走环境变量：把 DEEPSEEK_API_KEY 放在 .env 里（.gitignore 已忽略 .env）。
services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    ports:
      - "8787:8787"
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET:-请改掉这个默认值}
      AUTH_CODE: ${AUTH_CODE:-000000}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - api-data:/data
    restart: unless-stopped

volumes:
  api-data:
