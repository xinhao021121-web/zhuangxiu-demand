# 放到仓库根目录即可被 Netlify 识别
[build]
  command = "pnpm install --dir app --ignore-workspace && pnpm run build:h5"
  publish = "app/dist/h5"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
