# 自建服务器 / 云主机部署示例：把 app/dist/h5 上传到站点目录即可
server {
  listen 80;
  server_name demand.example.com;
  root /var/www/zhuangxiu-demand;
  index index.html;

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;

  # 带内容哈希的产物长期缓存
  location ~* \.[0-9a-f]{8,}\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html 不缓存，发版即生效；其余页面回退到 index.html
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
