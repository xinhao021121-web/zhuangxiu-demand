<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>筑云 · 装修需求发现助手 Demo V0.2</title>
<style>
:root{
  color-scheme: light;
  --bg-page:#f4f5f7; --bg-card:#ffffff; --bg-hover:#f1f3f5; --bg-active:#e9f1fb;
  --border:#e6e8eb; --border-strong:#d4d7db;
  --text-1:#16181c; --text-2:#5a5f66; --text-3:#9aa0a6;
  --primary:#2a78d6; --primary-hover:#256abf; --primary-weak:#e9f1fb;
  --success:#0ca30c; --warning:#fab219; --danger:#d03b3b;
  --success-bg:#e7f6e7; --warning-bg:#fdf3d7; --danger-bg:#fbe7e7;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 4px 16px rgba(16,24,40,.10);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16);
  --radius:10px; --radius-sm:7px;
  --font:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--text-1);font-family:var(--font);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:16px;
  padding:0 22px;background:var(--bg-card);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap}
.brand .dot{width:22px;height:22px;border-radius:6px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px}
.topbar .spacer{flex:1}
.progress-wrap{display:flex;align-items:center;gap:10px;min-width:280px}
.progress{position:relative;flex:1;height:8px;border-radius:99px;background:#eceef1;overflow:hidden}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--primary);border-radius:99px;transition:width .3s}
.progress-num{font-size:12.5px;color:var(--text-2);white-space:nowrap}
.btn{border:1px solid var(--border-strong);background:#fff;color:var(--text-1);border-radius:var(--radius-sm);
  padding:7px 13px;font-size:13px;transition:.15s}
.btn:hover{background:var(--bg-hover)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-soft{background:var(--primary-weak);border-color:transparent;color:var(--primary)}
.btn-sm{padding:4px 10px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:16px;align-items:start;
  max-width:1480px;margin:16px auto;padding:0 16px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.form-col{display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.sec-head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);cursor:pointer}
.sec-num{width:22px;height:22px;border-radius:50%;background:var(--primary-weak);color:var(--primary);
  font-size:12px;display:grid;place-items:center;font-weight:600;flex:none}
.sec-title{font-weight:600;font-size:14px}
.sec-meta{margin-left:auto;font-size:12px;color:var(--text-3)}
.sec-body{padding:6px 18px 16px}
.sec-card.collapsed .sec-body{display:none}
.group-title{font-size:12.5px;color:var(--text-3);margin:14px 0 8px;padding-top:10px;border-top:1px dashed var(--border)}
.group-title:first-child{border-top:0;padding-top:4px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1 / -1}
.field label{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rec{font-size:10.5px;color:#8a6200;background:var(--warning-bg);border-radius:4px;padding:0 6px}
.field input[type=text],.field input[type=number],.field input[type=month],.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  font-size:13.5px;font-family:inherit;color:var(--text-1);background:#fff;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
.field textarea{min-height:74px;resize:vertical}
.unit{font-size:12px;color:var(--text-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border-strong);background:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;
  color:var(--text-2);transition:.15s}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.ai-badge{display:inline-flex;align-items:center;gap:4px;background:var(--primary-weak);color:var(--primary);
  border-radius:99px;padding:1px 8px;font-size:11px;cursor:pointer}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--primary)}100%{box-shadow:0 0 0 3px transparent}}

/* 空间实例 */
.inst-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-top:12px;background:#fcfdfe}
.inst-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.inst-title{font-weight:600;font-size:13.5px}
.inst-sub{font-size:11.5px;color:var(--text-3)}
.inst-head .btn{margin-left:auto}
.type-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 4px;border-bottom:1px dashed var(--border);margin-bottom:6px}
.type-label{font-size:12.5px;color:var(--text-2)}
.inst-empty{border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:16px;text-align:center;
  color:var(--text-3);font-size:12.5px;margin-top:12px;background:#fcfdfe}
.inst-empty .btn{margin-top:10px}
.inst-actions{display:flex;gap:8px;justify-content:center;margin-top:12px}

/* 侧栏 */
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 92px)}
.side-card{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.side-head{padding:14px 16px;border-bottom:1px solid var(--border)}
.side-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.side-title .tag{font-size:11px;font-weight:400;color:var(--primary);background:var(--primary-weak);padding:1px 7px;border-radius:99px}
.counts{display:flex;gap:14px;margin-top:9px;font-size:12.5px;color:var(--text-2)}
.counts b{color:var(--text-1)}
.resume{margin-top:9px;padding:8px 10px;background:var(--bg-active);border-radius:var(--radius-sm);font-size:12.5px;color:var(--primary)}
.side-body{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 360px)}
.dk{border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius-sm);padding:11px 12px;background:#fff}
.dk.p0{border-left-color:var(--danger)}
.dk.p1{border-left-color:var(--warning)}
.dk.risk{background:#fffdf7}
.dk.done{background:var(--success-bg);border-left-color:var(--success)}
.dk-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.prio{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--bg-hover);color:var(--text-2)}
.prio.p0{background:var(--danger-bg);color:var(--danger)}
.prio.p1{background:var(--warning-bg);color:#8a6200}
.dk-kind{font-size:11px;color:var(--text-3)}
.dk-scope{margin-left:auto;font-size:11px;color:var(--primary);background:var(--primary-weak);border-radius:4px;padding:1px 6px}
.dk-title{font-size:13px;font-weight:600;line-height:1.45}
.dk-text{font-size:12.5px;color:var(--text-2);margin-top:5px}
.dk-why{font-size:11.5px;color:var(--text-3);margin-top:6px}
.dk-target{display:inline-block;font-size:11px;color:var(--primary);background:var(--primary-weak);
  border-radius:4px;padding:1px 6px;margin-top:7px;cursor:pointer}
.dk-acts{display:flex;gap:7px;margin-top:10px}
.dk-edit{width:100%;min-height:64px;margin-top:8px;padding:7px 9px;border:1px solid var(--border-strong);
  border-radius:6px;font-family:inherit;font-size:12.5px}
.empty{padding:26px 12px;text-align:center;color:var(--text-3);font-size:12.5px}
.more{font-size:12.5px;color:var(--primary);text-align:center;padding:6px;cursor:pointer}
.dots{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;border-top:1px solid var(--border)}
.sdot{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-3);border:1px solid var(--border);
  border-radius:99px;padding:3px 9px;background:#fff;cursor:pointer}
.sdot i{width:6px;height:6px;border-radius:50%;background:var(--border-strong)}
.sdot.part i{background:var(--warning)}
.sdot.done i{background:var(--success)}
.sdot:hover{border-color:var(--primary);color:var(--primary)}
.side-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}
.side-foot .btn{flex:1;text-align:center}
.quiet{font-size:12.5px;color:var(--warning);padding:10px 14px;background:var(--warning-bg);border-radius:var(--radius-sm)}

.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);max-width:660px;width:100%;max-height:82vh;display:flex;flex-direction:column}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-head h3{margin:0;font-size:15px}
.modal-head .btn{margin-left:auto}
.modal-body{padding:18px 20px;overflow:auto;font-size:13px;white-space:pre-wrap;line-height:1.75}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(12px);background:#16181c;color:#fff;
  padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1120px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .side-body{max-height:none}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot">筑</span> 装修需求采集 · 房主端</div>
  <div class="progress-wrap">
    <div class="progress"><i id="prog-bar" style="width:0%"></i></div>
    <span class="progress-num" id="prog-num">需求清晰度 0%</span>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btn-demo">填入示例需求</button>
  <button class="btn" id="btn-reset">重置</button>
  <button class="btn btn-primary" id="btn-summary">生成需求摘要</button>
  <button class="btn btn-primary" id="btn-submit">提交设计师</button>
</header>

<main class="layout">
  <div class="form-col" id="form-col"></div>
  <aside class="side">
    <section class="card side-card">
      <div class="side-head">
        <div class="side-title">需求发现助手 <span class="tag">纯规则</span></div>
        <div class="counts">
          <span>已发现 <b id="c-found">0</b></span>
          <span>已处理 <b id="c-handled">0</b></span>
          <span>待看 <b id="c-open">0</b></span>
        </div>
        <div class="resume" id="resume" style="display:none"></div>
      </div>
      <div class="side-body" id="dk-list"></div>
      <div class="dots" id="dots"></div>
      <div class="side-foot">
        <button class="btn btn-sm" id="btn-quiet">暂时不要建议</button>
        <button class="btn btn-sm btn-soft" id="btn-summary2">需求摘要</button>
      </div>
    </section>
  </aside>
</main>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title">需求摘要</h3><button class="btn btn-sm" id="modal-close">关闭</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn btn-sm" id="modal-copy">复制文本</button>
      <button class="btn btn-sm btn-primary" id="modal-ok">知道了</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* 字段清单由 tools/build_demo.py 从字段清单 V2 注入，保证 Demo 与规格一致 */
const FIELD_SPEC = /*__FIELD_SPEC__*/[];

/* 未注入字段数据（直接打开模板文件）时的保护 */
const HAS_SPEC = FIELD_SPEC.length > 0;

const SPEC = FIELD_SPEC;
const byId = new Map(SPEC.map(f => [f.id, f]));

/* 空间定义：固定空间只出现一次，实例空间可增删 */
const INSTANCE_DEF = {
  '卫生间': { max: 3, defaults: ['主卫', '客卫'], typeField: 'wc_type', namePrefix: '卫生间', other: 'wc_other' },
  '其他卧室': { max: 4, defaults: [], typeField: 'room_type', namePrefix: '次卧', other: 'room_other' },
  '书房与电竞房': { max: 2, defaults: [], typeField: null, namePrefix: '书房', other: 'st_other' }
};
const SECTION_OTHER = {
  '认识你家': 'base_other', '设备与系统': 'dev_other', '玄关': 'ex_other', '客厅': 'lv_other',
  '餐厅': 'dn_other', '厨房': 'kt_other', '阳台': 'bl_other', '主卧': 'br_other',
  '收纳与家政': 'sc_other', '补充说明': 'note_free'
};

const SECTIONS = (() => {
  const map = new Map();
  SPEC.forEach(f => {
    if (!map.has(f.section)) map.set(f.section, { name: f.section, scope: INSTANCE_DEF[f.section] ? f.section : '固定', groups: new Map() });
    const sec = map.get(f.section);
    if (!sec.groups.has(f.group)) sec.groups.set(f.group, []);
    sec.groups.get(f.group).push(f);
  });
  return [...map.values()].map(s => ({ ...s, groups: [...s.groups.entries()].map(([g, fields]) => ({ name: g, fields })), fields: [...s.groups.values()].flat() }));
})();

/* ============ 规则库（纯规则） ============ */
const has = (v, x) => Array.isArray(v) ? v.includes(x) : (v === x || (typeof v === 'string' && v.includes(x)));
const anyOf = (v, xs) => xs.some(x => has(v, x));
const OTHER = id => SECTION_OTHER[id] || null;

const RULES = [
  { id:'pet-cat', p:'P1', run:c => has(c.v.live_pet,'猫') ? [{ section:'认识你家', target:'base_other',
      title:'养猫家庭的专属空间与材质', text:'建议在阳台或卫生间预留猫砂盆位置，避免大面积绒面与皮质家具，猫爬架附近预留插座。',
      why:'因为你填了「是否养宠物：'+(c.v.live_pet||[]).join('、')+'」' }] : [] },
  { id:'pet-robot', p:'P2', run:c => anyOf(c.v.live_pet,['猫','狗']) ? [{ section:'阳台', target:'bl_robot', value:'阳台',
      title:'预留扫地机器人位置与回充点位', text:'养宠家庭地面清洁频率高，建议明确扫地机器人回充位置并预留插座。', why:'因为你养了宠物' }] : [] },
  { id:'elder', p:'P0', run:c => has(c.v.live_elder,'是') ? [{ section:'认识你家', target:'base_other',
      title:'适老安全设施', text:'建议长辈房与卫生间增加紧急按钮、防滑扶手与感应夜灯，地面避免高差。', why:'因为你填了「有老人或行动不便成员：是」' }] : [] },
  { id:'allergy', p:'P1', run:c => has(c.v.live_allergy,'是') ? [{ section:'认识你家', target:'base_other',
      title:'过敏成员的材质注意事项', text:'有过敏成员，软装避免长毛地毯与绒面沙发，优先可擦洗材质，并考虑新风与除螨。', why:'因为你填了「有鼻炎或过敏成员：是」' }] : [] },
  { id:'smoke', p:'P2', run:c => has(c.v.live_smoke,'是') ? [{ section:'认识你家', target:'base_other',
      title:'吸烟区与排风方案', text:'建议明确一个可关门的吸烟位置并做独立排风，避免烟味扩散到卧室与衣物。', why:'因为你填了「有吸烟成员：是」' }] : [] },
  { id:'budget', p:'P0', kind:'risk', run:c => (c.v.budget_total && c.v.base_area) ? [{ section:'认识你家', target:'budget_reserve', value:'是',
      title:'预算与面积匹配度提醒', text:'建议在预算之外单独预留 20% 作为增项备用金，装修过程中增项很难完全避免。', why:'因为你填了「建筑面积：'+c.v.base_area+'㎡」和「预算：'+c.v.budget_total+'」' }] : [] },
  { id:'schedule', p:'P0', kind:'risk', run:c => (c.v.date_finish && c.v.date_movein) ? [{ section:'认识你家', target:'date_start',
      title:'入住时间与定制家具周期冲突', text:'定制柜与木作的制作安装通常需要 45-60 天，建议把下单时间提前，避免影响入住。', why:'因为你填了计划完工与计划入住两个时间' }] : [] },
  { id:'oldhouse', p:'P1', run:c => has(c.v.base_house_state,'旧房翻新') ? [{ section:'认识你家', target:'base_other',
      title:'旧房翻新的隐蔽工程', text:'旧房建议先确认原有水电管线年限与防水状况，这部分通常是预算最容易超的地方。', why:'因为你填了「房屋现状：旧房翻新」' }] : [] },
  { id:'ac', p:'P1', run:c => anyOf(c.v.dev_ac,['中央空调','风管机']) ? [{ section:'设备与系统', target:'dev_other',
      title:'中央空调的吊顶与检修口', text:'中央空调需要吊顶包裹管道，请在需要的位置预留检修口，并确认层高是否满足。', why:'因为你填了「空调需求：'+(c.v.dev_ac||[]).join('、')+'」' }] : [] },
  { id:'heat', p:'P1', run:c => has(c.v.dev_heat,'地暖') ? [{ section:'设备与系统', target:'dev_other',
      title:'地暖带来的地面抬高', text:'地暖完成面通常抬高 8-10cm，木地板建议选地暖专用款，量房时需要确认与入户门槛的高度衔接。', why:'因为你填了「取暖方式：地暖」' }] : [] },
  { id:'kitchen-open', p:'P0', kind:'risk', run:c => (has(c.v.kt_form,'开放式') && has(c.v.kt_freq,'经常')) ? [{ section:'厨房', target:'kt_hood', value:'侧吸',
      title:'开放式厨房遇到高频下厨，油烟方案要先定', text:'建议确认油烟机形式与风量，并提前了解当地燃气公司对开放厨房的备案要求。', why:'因为你填了「厨房形式：开放式」和「下厨频率：经常」' }] : [] },
  { id:'kitchen-height', p:'P1', run:c => (c.v.kt_height_m || c.v.kt_height_f) ? [{ section:'厨房', target:'kt_counter', value:'需要',
      title:'按身高做高低台面', text:'按主要做饭人身高计算，洗切区比烹饪区高 8-10cm 更省腰，建议做高低台面。', why:'因为你填了身高「'+(c.v.kt_height_m||'-')+' / '+(c.v.kt_height_f||'-')+' cm」' }] : [] },
  { id:'dishwasher', p:'P2', run:c => anyOf(c.v.kt_dishwasher,['前开式','水槽式']) ? [{ section:'厨房', target:'kt_other',
      title:'洗碗机的水电与橱柜尺寸', text:'洗碗机需要进水、排水与插座，建议在橱柜设计前确定型号，避免后期改柜。', why:'因为你填了「洗碗机：'+c.v.kt_dishwasher+'」' }] : [] },
  { id:'office', p:'P1', run:c => has(c.v.office_need,'长期居家办公') ? [{ section:'设备与系统', target:'dev_smart', value:'全屋WIFI',
      title:'居家办公的网络与隔音', text:'建议工位预留有线网口，并给书房做隔音处理；全屋建议做 WIFI 全覆盖。', why:'因为你填了「办公需求：长期居家办公」' }] : [] },

/* ============ 状态 ============ */
let V = {};            // 固定字段
let INST = {};         // 实例空间
let AI = {};           // fieldKey -> true
let DK = {};           // ruleKey -> {status, text}
let NO_NEED = {};      // 已声明"没有该空间需求"的实例分区
let QUIET = false;
let DISMISS = 0;
let COLLAPSED = {};
let REVEAL = false;
let seq = 0;

const STORE_KEY = 'zy_demand_demo_v2';
const $ = s => document.querySelector(s);
const fk = (inst, id) => inst ? inst.key + '.' + id : id;
const empty = v => v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
const labelOf = id => (byId.get(id) || {}).label || id;
const recFields = SPEC.filter(f => f.suggest === '推荐填写');

function newInst(section, typeValue) {
  seq += 1;
  const def = INSTANCE_DEF[section];
  const inst = { key: 'i' + seq, section, values: {} };
  if (def.typeField && typeValue) inst.values[def.typeField] = typeValue;
  return inst;
}
function ensureInstances() {
  Object.entries(INSTANCE_DEF).forEach(([section, def]) => {
    if (!INST[section]) INST[section] = def.defaults.map(n => newInst(section, n));
  });
}
function nameOf(section, inst, index) {
  const def = INSTANCE_DEF[section];
  const type = def.typeField ? inst.values[def.typeField] : '';
  const base = def.namePrefix + (index + 1);
  if (section === '卫生间') return type || base;          // 主卫 / 客卫
  if (section === '书房与电竞房') return base;             // 书房1 / 书房2
  return base + (type ? ' · ' + type : '');                // 次卧1 · 儿童房
}
function instName(inst) {
  const list = INST[inst.section] || [];
  return nameOf(inst.section, inst, list.indexOf(inst));
}
function typeOf(inst) {
  const def = INSTANCE_DEF[inst.section];
  return def.typeField ? inst.values[def.typeField] : '';
}
function visibleFields(section, inst) {
  const t = typeOf(inst);
  return (SECTIONS.find(s => s.name === section) || { fields: [] }).fields
    .filter(f => f.applies === '全部' || f.applies === t);
}

/* ============ 计算 ============ */
function ctx() {
  return { v: V, inst: section => INST[section] || [], name: instName, type: typeOf };
}
function runRules() {
  const c = ctx();
  const out = [];
  RULES.forEach(r => {
    let list = [];
    try { list = r.run(c) || []; } catch (e) { list = []; }
    list.forEach(item => out.push({ ...item, ruleId: r.id, id: r.id + '#' + (item.inst ? item.inst.key : '-'), p: r.p, kind: r.kind || 'discover' }));
  });
  return out;
}
function fillSuggestions() {
  const out = [];
  const fixedGap = recFields.filter(f => f.scope === '固定' && empty(V[f.id])).slice(0, 2);
  fixedGap.forEach(f => out.push({
    id: 'fill#' + f.id, ruleId: 'fill#' + f.id, p: 'P1', kind: 'fill', section: f.section, target: f.id,
    title: '还差一项关键信息：' + f.label, text: '这项直接影响助手给建议的准确度，勾选一下就行。', why: '推荐填写项未完成'
  }));
  Object.entries(INSTANCE_DEF).forEach(([section, def]) => {
    (INST[section] || []).forEach((inst, i) => {
      const need = def.typeField ? inst.values[def.typeField] : '';
      const missing = def.typeField && empty(need);
      if (missing) out.push({
        id: 'type#' + inst.key, ruleId: 'type#' + inst.key, p: 'P1', kind: 'fill', section, inst, target: def.typeField,
        title: (def.namePrefix + (i + 1)) + ' 还没选房间用途', text: '选完用途后，这里只显示相关的需求项，不用填无关内容。', why: '房间用途会影响需要了解的内容'
      });
      (INST[section].length < 1 ? [] : []).forEach(() => {});
    });
  });
  return out;
}
function allSuggestions() { return [...fillSuggestions(), ...runRules()]; }
function openSuggestions() { return allSuggestions().filter(s => !DK[s.id] || DK[s.id].status === 'new'); }
function foundCount() { return allSuggestions().length; }

function recStats() {
  let total = 0, done = 0;
  recFields.forEach(f => {
    if (f.scope === '固定') { total += 1; if (!empty(V[f.id])) done += 1; }
    else (INST[f.section] || []).forEach(inst => { total += 1; if (!empty(inst.values[f.id])) done += 1; });
  });
  return { total, done };
}

/* ============ 渲染：表单 ============ */
function controlOf(f, inst) {
  const key = fk(inst, f.id);
  const v = inst ? inst.values[f.id] : V[f.id];
  if (f.type === '单选' || f.type === '多选') {
    const multi = f.type === '多选';
    return '<div class="chips">' + f.options.map(o =>
      '<button class="chip' + (multi ? (has(v, o) ? ' on' : '') : (v === o ? ' on' : '')) +
      '" data-act="chip" data-key="' + key + '" data-val="' + o.replace(/"/g, '&quot;') + '">' + o + '</button>').join('') + '</div>';
  }
  if (f.type === '长文本') return '<textarea data-act="input" data-key="' + key + '" placeholder="' + (f.unit || '') + '">' + (v || '') + '</textarea>';
  const t = f.type === '数字' ? 'number' : (f.type === '日期' ? 'month' : 'text');
  const val = v === undefined || v === null ? '' : v;
  return '<input type="' + t + '" data-act="input" data-key="' + key + '" value="' + String(val).replace(/"/g, '&quot;') +
    '" placeholder="' + (f.unit || '') + '" />' + (f.unit && f.type === '数字' ? '<span class="unit">' + f.unit + '</span>' : '');
}
function fieldHtml(f, inst) {
  const key = fk(inst, f.id);
  return '<div class="field' + (f.type === '长文本' ? ' wide' : '') + '" id="fi-' + key + '">' +
    '<label>' + f.label + (f.suggest === '推荐填写' ? '<span class="rec">推荐填写</span>' : '') +
    (AI[key] ? '<span class="ai-badge" data-act="undo" data-key="' + key + '">✦ 助手建议 · 撤销</span>' : '') +
    '</label>' + controlOf(f, inst) + '</div>';
}
function groupsHtml(fields, inst) {
  const groups = new Map();
  fields.forEach(f => { if (!groups.has(f.group)) groups.set(f.group, []); groups.get(f.group).push(f); });
  return [...groups.entries()].map(([g, list]) =>
    '<div class="group-title">' + g + '</div><div class="grid">' + list.map(f => fieldHtml(f, inst)).join('') + '</div>').join('');
}

function renderForm() {
  if (!HAS_SPEC) {
    $('#form-col').innerHTML = '<div class="card" style="padding:44px 24px;text-align:center;color:#5a5f66;line-height:2">' +
      '这是构建用的模板文件，不包含字段数据。<br/>请打开：<b>demo/装修需求发现助手_Demo_V0.2.html</b></div>';
    return;
  }
  $('#form-col').innerHTML = SECTIONS.map((s, i) => {
    const collapsed = COLLAPSED[s.name];
    let body = '';
    let meta = '';
    if (s.scope === '固定') {
      const filled = s.fields.filter(f => !empty(V[f.id])).length;
      meta = filled + ' / ' + s.fields.length;
      body = groupsHtml(s.fields, null);
    } else {
      const list = INST[s.name] || [];
      meta = list.length + ' 个空间';
      if (!list.length) {
        body = '<div class="inst-empty">' + (NO_NEED[s.name] ? '已确认：这个空间暂时没有需求' : '还没有添加' + s.name) +
          '<div class="inst-actions">' +
          '<button class="btn btn-sm" data-act="no-need" data-sec="' + s.name + '">' + (NO_NEED[s.name] ? '恢复' : '没有需求，跳过') + '</button>' +
          '<button class="btn btn-sm btn-primary" data-act="add-inst" data-sec="' + s.name + '">+ 添加' + INSTANCE_DEF[s.name].namePrefix + '</button>' +
          '</div></div>';
      } else {
        body = list.map((inst, idx) => {
          const fields = visibleFields(s.name, inst);
          const filled = fields.filter(f => !empty(inst.values[f.id])).length;
          const def = INSTANCE_DEF[s.name];
          const typeField = def.typeField ? byId.get(def.typeField) : null;
          return '<div class="inst-card" data-inst="' + inst.key + '">' +
            '<div class="inst-head"><span class="inst-title">' + nameOf(s.name, inst, idx) + '</span>' +
            '<span class="inst-sub">' + filled + ' / ' + fields.length + ' 项已填</span>' +
            (list.length > 1 || (list.length + 1 > 1) ? '<button class="btn btn-sm" data-act="del-inst" data-sec="' + s.name + '" data-key="' + inst.key + '">删除</button>' : '') +
            '</div>' +
            (typeField ? '<div class="type-row"><span class="type-label">' + typeField.label + '</span>' + controlOf(typeField, inst) + '</div>' : '') +
            groupsHtml(fields.filter(f => f.id !== (def.typeField || '')), inst) + '</div>';
        }).join('') +
        '<div class="inst-actions">' +
        (list.length < INSTANCE_DEF[s.name].max
          ? '<button class="btn btn-sm" data-act="add-inst" data-sec="' + s.name + '">+ 添加' + INSTANCE_DEF[s.name].namePrefix + '（还可添加 ' + (INSTANCE_DEF[s.name].max - list.length) + ' 个）</button>'
          : '<span class="inst-sub">已达上限 ' + INSTANCE_DEF[s.name].max + ' 个</span>') +
        '</div>';
      }
    }
    return '<section class="card sec-card' + (collapsed ? ' collapsed' : '') + '" data-sec="' + s.name + '">' +
      '<div class="sec-head" data-act="toggle" data-sec="' + s.name + '">' +
      '<span class="sec-num">' + (i + 1) + '</span><span class="sec-title">' + s.name + '</span>' +
      '<span class="sec-meta">' + meta + (collapsed ? ' · 展开' : '') + '</span></div>' +
      '<div class="sec-body">' + body + '</div></section>';
  }).join('');
}

/* ============ 渲染：侧栏 ============ */
function renderSide() {

    ['#c-found', '#c-handled', '#c-open'].forEach(s => { $(s).textContent = '0'; });

  }
  const open = openSuggestions();
  const handled = Object.values(DK).filter(d => d.status !== 'new').length;

  $('#c-handled').textContent = handled;

    return '<div class="dk ' + s.p.toLowerCase() + (s.kind === 'risk' ? ' risk' : '') + '" data-rule="' + s.id + '">' +
      '<div class="dk-top"><span class="prio ' + s.p.toLowerCase() + '">' + s.p + '</span>' +
      '<span class="dk-kind">' + kind + '</span>' + scopeTag + '</div>' +
      '<div class="dk-title">' + s.title + '</div>' +
      '<div class="dk-text">' + s.text + '</div>' +
      '<div class="dk-why">' + s.why + '</div>' +
      '<span class="dk-target" data-act="goto" data-key="' + fk(s.inst, s.target) + '">→ ' + (s.inst ? instName(s.inst) + ' · ' : '') + labelOf(s.target) + '</span>' +
      (s.kind === 'fill'
        ? '<div class="dk-acts"><button class="btn btn-sm btn-soft" data-act="goto" data-key="' + fk(s.inst, s.target) + '">去填写</button></div>'
        : '<div class="dk-acts"><button class="btn btn-sm btn-primary" data-act="adopt" data-id="' + s.id + '">加入</button>' +
          '<button class="btn btn-sm" data-act="edit" data-id="' + s.id + '">改一改</button>' +
          '<button class="btn btn-sm" data-act="ignore" data-id="' + s.id + '">不感兴趣</button></div>') +
      '</div>';
  }).join('') + (open.length > 3 && !REVEAL ? '<div class="more" data-act="reveal">展开更多（还有 ' + (open.length - 3) + ' 条）</div>' : '');
}

function renderDots() {
  $('#dots').innerHTML = SECTIONS.map(s => {
    const fields = s.scope === '固定' ? s.fields : (INST[s.name] || []).flatMap(i => visibleFields(s.name, i));
    const filled = s.scope === '固定'
      ? fields.filter(f => !empty(V[f.id])).length
      : (INST[s.name] || []).flatMap(i => visibleFields(s.name, i).filter(f => !empty(i.values[f.id]))).length;
    const total = s.scope === '固定' ? fields.length : (fields.length || 1);
    const cls = filled === 0 ? '' : (filled >= total ? 'done' : 'part');
    return '<span class="sdot ' + cls + '" data-act="goto-sec" data-sec="' + s.name + '"><i></i>' + s.name + '</span>';
  }).join('');
}
function renderProgress() {
  const { total, done } = recStats();
  const pct = total ? Math.round(done / total * 100) : 0;
  $('#prog-bar').style.width = pct + '%';
  $('#prog-num').textContent = '需求清晰度 ' + pct + '% · 推荐项 ' + done + '/' + total;
}
function renderAll() { renderForm(); renderSide(); renderDots(); renderProgress(); save(); }

/* ============ 动作 ============ */
function setValue(key, val) {
  const [instKey, id] = key.includes('.') ? key.split('.') : [null, key];
  const inst = instKey ? Object.values(INST).flat().find(i => i.key === instKey) : null;
  if (inst) inst.values[id] = val; else V[id] = val;
  delete AI[key];
}
function getSuggestion(id) { return allSuggestions().find(s => s.id === id); }

function adopt(id, customText) {
  const s = getSuggestion(id);
  if (!s) return;
  const f = byId.get(s.target);
  const text = customText || s.text;
  const key = fk(s.inst, s.target);
  const cur = s.inst ? s.inst.values[s.target] : V[s.target];
  if (f && f.type === '单选' && s.value) {
    setValue(key, s.value);
  } else if (f && (f.type === '长文本' || f.type === '文本')) {
    setValue(key, cur ? (cur + '\n' + text) : text);
  } else if (f && f.type === '多选') {
    const list = Array.isArray(cur) ? cur.slice() : [];
    const opt = (f.options || []).find(o => text.includes(o)) || (s.value || text);
    if (!list.includes(opt)) list.push(opt);
    setValue(key, list);
  } else {
    setValue(key, text);
  }
  AI[key] = true;
  DK[id] = { status: 'adopted', text };
  toast('已写入「' + (s.inst ? instName(s.inst) + ' · ' : '') + labelOf(s.target) + '」，可在字段旁撤销');
  renderAll();
}
function ignore(id) {
  DK[id] = { status: 'ignored' };
  DISMISS += 1;
  if (DISMISS >= 3 && !QUIET) { QUIET = true; toast('连续 3 次不感兴趣，已进入静默模式'); }
  else toast('已忽略，同类建议不再出现');
  renderAll();
}
function undoAI(key) { setValue(key, ''); toast('已撤销该字段的助手建议'); renderAll(); }

function addInstance(section, typeValue) {
  if (!INST[section]) INST[section] = [];
  if (INST[section].length >= INSTANCE_DEF[section].max) return;
  INST[section].push(newInst(section, typeValue));
  NO_NEED[section] = false;
  renderAll(); toast('已添加' + INSTANCE_DEF[section].namePrefix + '，选一下用途就能看到相关需求');
}
function removeInstance(section, key) {
  const inst = (INST[section] || []).find(i => i.key === key);
  if (!inst) return;
  const filled = Object.values(inst.values).filter(v => !empty(v)).length;
  if (filled && !confirm('「' + instName(inst) + '」已经填了 ' + filled + ' 项内容，确认删除吗？')) return;
  INST[section] = INST[section].filter(i => i.key !== key);
  Object.keys(AI).forEach(k => { if (k.startsWith(key + '.')) delete AI[k]; });
  renderAll(); toast('已删除该空间');
}
function gotoField(key) {
  const el = document.getElementById('fi-' + key);
  if (!el) return;
  const sec = el.closest('.sec-card');
  if (sec && sec.classList.contains('collapsed')) { COLLAPSED[sec.dataset.sec] = false; renderForm(); }
  const target = document.getElementById('fi-' + key);
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.add('flash');
  setTimeout(() => target.classList.remove('flash'), 1700);
}

function summaryText() {
  const lines = [];
  const adopted = Object.values(DK).filter(d => d.status === 'adopted').map(d => d.text);
  lines.push('【需求摘要】' + (V.base_area || '-') + '㎡ · ' + (V.base_house_state || '-') + ' · ' +
    ((V.style_pref || []).join('、') || '-') + ' · 预算 ' + (V.budget_total || '-'));
  lines.push('');
  lines.push('一、' + '认识你家');
  const base = SECTIONS.find(s => s.name === '认识你家');
  const baseItems = base.fields.filter(f => !empty(V[f.id])).map(f => f.label + '：' + (Array.isArray(V[f.id]) ? V[f.id].join('、') : V[f.id]));
  lines.push('  ' + (baseItems.join('；') || '（待补充）'));
  SECTIONS.filter(s => s.name !== '认识你家' && s.name !== '补充说明').forEach(s => {
    if (s.scope === '固定') {
      const items = s.fields.filter(f => !empty(V[f.id])).map(f => f.label + '：' + (Array.isArray(V[f.id]) ? V[f.id].join('、') : V[f.id]));
      if (items.length) { lines.push(''); lines.push('· ' + s.name); lines.push('  ' + items.join('；')); }
    } else {
      const list = INST[s.name] || [];
      if (!list.length) return;
      lines.push('');
      lines.push('· ' + s.name + '（' + list.length + ' 个）');
      list.forEach((inst, i) => {
        const items = visibleFields(s.name, inst).filter(f => !empty(inst.values[f.id]))
          .map(f => f.label + '：' + (Array.isArray(inst.values[f.id]) ? inst.values[f.id].join('、') : inst.values[f.id]));
        lines.push('  ' + nameOf(s.name, inst, i) + '：' + (items.join('；') || '（未填写）'));
      });
    }
  });
  if (adopted.length) {
    lines.push('');
    lines.push('二、助手发现并确认的需求');
    adopted.forEach(t => lines.push('  · ' + t));
  }
  if (!empty(V.note_free)) { lines.push(''); lines.push('三、其他补充'); lines.push('  ' + V.note_free); }
  return lines.join('\n');
}
function showModal(title, body) {
  $('#modal-title').textContent = title;
  $('#modal-body').textContent = body;
  $('#mask').classList.add('on');
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ============ 示例数据 ============ */
function fillDemo() {
  V = Object.assign({}, V, {
    base_house_state: '旧房翻新', base_area: 89, live_type: '长期居住',
    live_members: ['夫妻', '儿子'], live_pet: ['猫'], live_pet_count: 1,
    live_elder: '否', live_allergy: '否', budget_total: '20-30万', mode: '半包',
    style_pref: ['现代简约'], office_need: '偶尔', date_finish: '2026-10', date_movein: '2026-12',
    kt_freq: '经常', kt_form: '开放式', kt_height_m: 175, kt_height_f: 162, kt_dishwasher: '前开式',
    lv_bookshelf: '需要', bl_washer: '是', bl_dryer: '是', dn_people: 3, br_bed: '1.8m',
    ex_boots: 2, sc_luggage: 2, clean_tools: ['扫地机器人'], guest_freq: '偶尔'
  });
  INST['卫生间'] = [newInst('卫生间', '主卫'), newInst('卫生间', '客卫')];
  Object.assign(INST['卫生间'][0].values, { wc_drywet: '是', wc_toilet: '智能马桶', wc_bath: '浴缸加淋浴' });
  Object.assign(INST['卫生间'][1].values, { wc_drywet: '是', wc_toilet: '普通马桶', wc_bath: '淋浴' });
  INST['其他卧室'] = [newInst('其他卧室', '儿童房')];
  Object.assign(INST['其他卧室'][0].values, { room_type: '儿童房', room_bed: '1.5m', room_desk: '可升降书桌' });
  INST['书房与电竞房'] = [];
  renderAll();
  toast('已填入示例：89㎡ 旧房翻新 + 养猫 + 两个卫生间，看右侧助手的变化');
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      V, INST, AI, DK, NO_NEED, QUIET, DISMISS, seq,
      struct: Object.fromEntries(Object.entries(INST).map(([k, v]) => [k, v.map(i => ({ key: i.key, section: i.section, values: i.values }))]))
    }));
  } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    V = d.V || {}; AI = d.AI || {}; DK = d.DK || {}; NO_NEED = d.NO_NEED || {};
    QUIET = !!d.QUIET; DISMISS = d.DISMISS || 0; seq = d.seq || 0;
    INST = {};
    Object.entries(d.struct || {}).forEach(([sec, list]) => { INST[sec] = list.map(i => ({ key: i.key, section: i.section, values: i.values || {} })); });
  } catch (e) {}
}

/* ============ 事件 ============ */
let timer = null;
function debouncedRefresh() {
  clearTimeout(timer);
  timer = setTimeout(() => { renderSide(); renderDots(); renderProgress(); save(); }, 500);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'toggle') {
    COLLAPSED[el.dataset.sec] = !COLLAPSED[el.dataset.sec];
    renderForm();
  } else if (act === 'chip') {
    const key = el.dataset.key;
    const val = el.dataset.val;
    const [instKey, id] = key.includes('.') ? key.split('.') : [null, key];
    const f = byId.get(id);
    const inst = instKey ? Object.values(INST).flat().find(i => i.key === instKey) : null;
    if (f.type === '多选') {
      const cur = Array.isArray(inst ? inst.values[id] : V[id]) ? (inst ? inst.values[id] : V[id]).slice() : [];
      const i = cur.indexOf(val);
      i >= 0 ? cur.splice(i, 1) : cur.push(val);
      setValue(key, cur);
    } else {
      setValue(key, (inst ? inst.values[id] : V[id]) === val ? '' : val);
    }
    renderForm(); debouncedRefresh();
  } else if (act === 'input-nothing') {
    /* 占位 */
  } else if (act === 'add-inst') {
    addInstance(el.dataset.sec);
  } else if (act === 'del-inst') {
    removeInstance(el.dataset.sec, el.dataset.key);
  } else if (act === 'no-need') {
    NO_NEED[el.dataset.sec] = !NO_NEED[el.dataset.sec];
    renderAll();
  } else if (act === 'goto') {
    gotoField(el.dataset.key);
  } else if (act === 'goto-sec') {
    const sec = el.dataset.sec;
    COLLAPSED[sec] = false;
    renderForm();
    document.querySelector('.sec-card[data-sec="' + sec + '"]').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else if (act === 'adopt') {
    adopt(el.dataset.id);
  } else if (act === 'ignore') {
    ignore(el.dataset.id);
  } else if (act === 'undo') {
    undoAI(el.dataset.key);
  } else if (act === 'reveal') {
    REVEAL = true; renderSide();
  } else if (act === 'edit') {
    const id = el.dataset.id;
    const s = getSuggestion(id);
    const box = el.closest('.dk');
    if (!s || !box) return;
    box.querySelector('.dk-acts').innerHTML =
      '<textarea class="dk-edit">' + s.text + '</textarea>' +
      '<div style="display:flex;gap:7px;margin-top:8px"><button class="btn btn-sm btn-primary" data-act="edit-ok" data-id="' + id + '">确认写入</button>' +
      '<button class="btn btn-sm" data-act="edit-cancel">取消</button></div>';
  } else if (act === 'edit-ok') {
    const box = el.closest('.dk');
    adopt(el.dataset.id, box.querySelector('.dk-edit').value.trim());
  } else if (act === 'edit-cancel') {
    renderSide();
  }
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-act="input"]');
  if (!el) return;
  const key = el.dataset.key;
  const [instKey, id] = key.includes('.') ? key.split('.') : [null, key];
  const f = byId.get(id);
  const v = el.value;
  setValue(key, f.type === '数字' ? (v === '' ? '' : Number(v)) : v);
  debouncedRefresh();
});

$('#btn-demo').onclick = fillDemo;
$('#btn-reset').onclick = () => {
  V = {}; INST = {}; AI = {}; DK = {}; NO_NEED = {}; QUIET = false; DISMISS = 0; REVEAL = false; seq = 0;
  ensureInstances();
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  renderAll(); toast('已重置');
};
$('#btn-summary').onclick = $('#btn-summary2').onclick = () => showModal('需求摘要（模拟生成）', summaryText());
$('#btn-submit').onclick = () => {
  const { total, done } = recStats();
  const pct = total ? Math.round(done / total * 100) : 0;
  const open = openSuggestions().length;
  showModal('提交前检查',
    '需求清晰度 ' + pct + '%（推荐项 ' + done + '/' + total + '）\n' +
    '已确认助手发现 ' + Object.values(DK).filter(d => d.status === 'adopted').length + ' 条\n' +
    (open ? '还有 ' + open + ' 条发现未处理，可以选择「仍要提交」或先回去处理。' : '发现项已处理完毕，可以提交。') +
    '\n\n提交后会生成《需求意向书》和《量房确认清单》两份材料（Demo 中不实现）。');
};
$('#btn-quiet').onclick = () => {
  QUIET = !QUIET;
  $('#btn-quiet').textContent = QUIET ? '恢复建议' : '暂时不要建议';
  toast(QUIET ? '已进入静默模式' : '已恢复建议');
  renderSide(); save();
};
$('#modal-close').onclick = $('#modal-ok').onclick = () => $('#mask').classList.remove('on');
$('#mask').onclick = e => { if (e.target === $('#mask')) $('#mask').classList.remove('on'); };
$('#modal-copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('#modal-body').textContent); toast('已复制到剪贴板'); }
  catch (e) { toast('当前浏览器不允许自动复制，请手动选择文本'); }
};

/* ============ 启动 ============ */
if (HAS_SPEC) load();
ensureInstances();
if (HAS_SPEC && !Object.keys(V).length) { COLLAPSED = { '认识你家': false }; }
else if (HAS_SPEC) { COLLAPSED = {}; }
renderAll();
if (HAS_SPEC && !Object.keys(V).length) toast('提示：点右上角「填入示例需求」可以快速体验完整流程');
</script>
